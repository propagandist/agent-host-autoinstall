# agent-host-01 だけの値。common.yaml に重ねる(ファイル名はホスト名と同じにする)。
# 共通と違うものだけ書く(例: このホストだけ Zed も入れるなら editors を並べなおす。並びは置き換わる)

hostname: agent-host-01

network:
  mode: static
  interface: "en*"
  address: 192.0.2.10/24
  gateway: 192.0.2.1
  dns:
    - 192.0.2.53

# このホストを使う人(並びは置き換わるので、ホストごとに全員を書く)。port は人に固定する
users:
  - name: alice
    port: 3389
    rdp:
      username: alice
      initial_password: "CHANGE_ME"   # 初回だけの仮の値。本人が最初の RDP で変える
    git_user_name: alice
    git_user_email: alice@example.invalid
    ssh_authorized_keys: []

# 台ごとに変えると、RDP でどのホストに入っているか見分けやすい
desktop_color: "#1f3a5f"
