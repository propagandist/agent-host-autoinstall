# 環境固有値のサンプル。env.yaml にコピーして実値を入れる(env.yaml はコミットしない)。
# CHANGE_ME が残っていると build-usb.sh は止まる。

# ホスト名
hostname: agent-host-01

# キーボード配列。RDP で使う人のキーボードに合わせる(101/104 の英字配列なら us、106/109 の日本語配列なら jp)。
# RDP ではキーの位置がそのまま送られ、ホスト側の配列で文字になるので、合っていないと記号がずれる
keyboard_layout: us

sysadmin:
  # sysadmin のパスワードハッシュ。sudo とコンソールログインに使う(SSH はパスワード不可)。
  # 作り方: mkpasswd -m sha-512 (whois パッケージ)
  password_hash: "$6$CHANGE_ME"
  # SSH の公開鍵(1 行 1 鍵)
  ssh_authorized_keys:
    - "ssh-ed25519 AAAA_CHANGE_ME sysadmin@example"

# ネットワーク。mode は dhcp(DHCP 予約を含む)か static
# インストール中もこの設定で通信する(Desktop ISO には openssh-server がなく、取得にネットワークが要る)
network:
  mode: static
  # 設定するインターフェース。en* はすべての有線 LAN に当てはまるので、有線が 2 つ以上ある機種では名前を指定する
  interface: "en*"
  # 以下は static のときだけ使う
  address: 192.0.2.10/24
  gateway: 192.0.2.1
  dns:
    - 192.0.2.53
  search:
    - example.internal

# NTP サーバー。空なら Ubuntu の既定(ntp.ubuntu.com)。社内から届かないときに指定する
ntp_servers: []

# agent が git commit するときの名前とメールアドレス
git_user_name: agent-host-01
git_user_email: agent-host-01@example.invalid

# 社内のプロキシ。url が空なら使わない。インストール中の apt にも使う
proxy:
  url: ""                                   # 例: http://proxy.example.internal:8080
  no_proxy: "localhost,127.0.0.1,::1"

# 社内の CA 証明書(PEM)。TLS を検査するプロキシなどがあるときに並べる。空なら何もしない
ca_certs: []
#  - |
#    -----BEGIN CERTIFICATE-----
#    ...
#    -----END CERTIFICATE-----

# 入れるエディター。使える値: vscode, neovim, zed(空なら入れない。zed は GPU(Vulkan)が要る)
editors:
  - vscode

# agent に SFTP で入れる人の公開鍵(SFTP 専用。シェルには入れない)。空なら agent には SSH で入れない
agent_ssh_authorized_keys: []

# 手元の PC から開発サーバーを見るために、社内LANから開けるポート(例: "3000:3999"、"5173")。空なら開けない
dev_ports: []

# SSH(22)と RDP(3389)を許可する社内LANの範囲(CIDR)。これ以外からは拒否する
lan_cidrs:
  - 192.0.2.0/24   # 例示用のアドレス(RFC 5737)。実際の範囲に置き換える

# デスクトップ共有(RDP)の認証情報。RDP クライアントで入力する
rdp:
  username: agent
  password: "CHANGE_ME"
