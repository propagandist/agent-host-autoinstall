# 環境固有値のサンプル。env.yaml にコピーして実値を入れる(env.yaml はコミットしない)。
# CHANGE_ME が残っていると just check-env・just iso・just update は止まる。

# ホスト名(インストールのときだけ効く。変えるなら入れなおす)
hostname: agent-host-01

# キーボード配列。RDP で使う人のキーボードに合わせる(101/104 の英字配列なら us、106/109 の日本語配列なら jp)。
# インストールのときだけ効く(just update では変わらない)。
# RDP ではキーの位置がそのまま送られ、ホスト側の配列で文字になるので、合っていないと記号がずれる
keyboard_layout: us

sysadmin:
  # sysadmin のパスワードハッシュ。sudo とコンソールログインに使う(SSH はパスワード不可)。
  # 作り方: mkpasswd -m sha-512 (whois パッケージ)。just update でも反映する(ホストで passwd で替えていても戻る)
  password_hash: "$6$CHANGE_ME"
  # SSH の公開鍵(1 行 1 鍵)。just update で ~sysadmin/.ssh/authorized_keys をこの内容に置き換える
  # (手で足した鍵は消える。今つないでいる鍵を外すと、次から入れなくなる)
  ssh_authorized_keys:
    - "ssh-ed25519 AAAA_CHANGE_ME sysadmin@example"

# ネットワーク。mode は dhcp(DHCP 予約を含む)か static。インストールのときだけ効く(just update では変わらない)
# インストール中もこの設定で通信する(Desktop ISO には openssh-server がなく、取得にネットワークが要る)
network:
  mode: static
  # 設定するインターフェース。en* はすべての有線 LAN に当てはまるので、有線が 2 つ以上ある機種では名前を指定する
  interface: "en*"
  # 以下は static のときだけ使う
  address: 192.0.2.10/24
  gateway: 192.0.2.1
  dns:
    - 192.0.2.53
  search:
    - example.internal

# NTP サーバー。空なら Ubuntu の既定(ntp.ubuntu.com)。その LAN から届かないときに指定する
ntp_servers: []

# agent が git commit するときの名前とメールアドレス
git_user_name: agent-host-01
git_user_email: agent-host-01@example.invalid

# HTTP プロキシ。url が空なら使わない。インストール中の apt にも使う
proxy:
  url: ""                                   # 例: http://proxy.example.internal:8080
  no_proxy: "localhost,127.0.0.1,::1"

# 独自の CA 証明書(PEM)。TLS を検査するプロキシなどがあるときに並べる。空なら何もしない
ca_certs: []
#  - |
#    -----BEGIN CERTIFICATE-----
#    ...
#    -----END CERTIFICATE-----

# 入れるエディター。使える値: vscode, neovim, zed(空なら入れない。zed は GPU(Vulkan)が要る)
editors:
  - vscode

# VS Code に足す拡張機能(発行者.名前 か 発行者.名前@版。版を書かなければ、初めて入れたときの最新)。
# 基本(日本語、Claude Code、Codex、YAML、Docker、GitHub Pull Requests ほか)と Python・JavaScript の拡張機能、
# clouds で選んだクラウドの拡張機能は、書かなくても入る(72-editors.sh)
vscode_extensions: []

# Zed に足す拡張機能(zed.dev の ID。版は指定できず、Zed を次に起動したときの最新が入り、その後は更新しない)。
# 基本(TOML、Dockerfile、Docker Compose、HTML、Make、SQL、env、Git Firefly)と、clouds を選んだときの
# Terraform は、書かなくても入る(72-editors.sh)
zed_extensions: []

# デスクトップの壁紙の色(#RRGGBB)。台ごとに変えると、RDP でどのホストに入っているか見分けやすい。空なら灰色
desktop_color: ""

# Gitea の URL(例 https://gitea.example.internal)。空でもよい。
# 書くと、Gitea CLI(tea。いつも入れる)のログインの既定の接続先になり、エージェント向けの説明にも載る
gitea_url: ""

# 追加で入れる AI エージェント。使える値: opencode, copilot(Copilot の契約が要る), antigravity(Google)
# Claude Code と Codex はいつも入れる
agents:
  - opencode

# 入れるクラウドの CLI。使える値: aws(AWS CLI v2), gcp(Google Cloud CLI), azure(Azure CLI)。空なら入れない。
# 認証は短い時間だけ有効なログイン(aws sso login、gcloud auth login、az login)と、
# 権限を絞った開発用のアカウントで使う。長く使えるアクセスキーは置かない
clouds: []

# エージェントの通知(承認待ち・エラーは両方、完了は Slack だけ)。空なら送らない
notify:
  # Slack の Incoming Webhook の URL(秘密情報)
  slack_webhook_url: ""
  # IP Messenger で知らせる相手。IP Messenger のユーザー名・PC 名(ホスト名)・ニックネームか、IP アドレス。
  # 名前は送るたびに LAN へブロードキャストして探す(DHCP で IP が変わっても届く)。暗号化しないので本文に秘密情報を入れない
  ipmsg_to: []
  # 探すときのブロードキャストの宛先。空なら 255.255.255.255(同じサブネットだけ)。
  # 別のサブネットの PC も探すときは、そのサブネットのブロードキャストアドレス(例 192.0.2.255)を足す
  ipmsg_broadcast: []

# UPS(無停電電源装置)。NUT(Network UPS Tools)で状態を見て、バッテリーが少なくなったら正しく終了する。
# mode: none(使わない)・usb(この PC に USB などでつなぐ)・netclient(ほかの機器の NUT サーバーを見る)
# usb のときは、終了したあとに UPS の出力を止めさせる。電源が戻ると UPS が出力を戻し、BIOS の設定で PC が起動する
ups:
  mode: none
  # usb のとき: NUT のドライバーとポート。多くの USB の UPS は usbhid-ups と auto(対応表は networkupstools.org)
  driver: usbhid-ups
  port: auto
  # UPS の名前。usb ではこのホストの NUT の中の名前、netclient では NUT サーバーの側の名前
  name: ups
  # netclient のとき: NUT サーバーのアドレス、監視用のユーザーとパスワード(秘密情報)。
  # 出力を止めるのは NUT サーバーの側(このホストは先に終了するだけ)
  server: ""
  username: ""
  password: ""

# agent に SFTP で入れる人の公開鍵(SFTP 専用。シェルには入れない)。空なら agent には SSH で入れない
agent_ssh_authorized_keys: []

# 手元の PC から開発サーバーを見るために、LAN から開けるポート(例: "3000:3999"、"5173")。空なら開けない。
# Orca Mobile を LAN でつなぐなら 6768 も足す(docs/manual-steps.md の 13)
dev_ports: []

# SSH(22)と RDP(3389)を許可する LAN の範囲(CIDR)。これ以外からは拒否する
lan_cidrs:
  - 192.0.2.0/24   # 例示用のアドレス(RFC 5737)。実際の範囲に置き換える

# デスクトップ共有(RDP)の認証情報。RDP クライアントで入力する
rdp:
  username: agent
  password: "CHANGE_ME"
